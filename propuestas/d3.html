<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"><link rel="stylesheet" href="p.css"><script src="ill.js"></script></head><body>
<header class="bar"><span class="wm">botella<i></i></span><button class="pill pa">Entrar</button></header>
<style>.qc{left:16px;right:16px;bottom:20px}.qc h3{font-size:24px;line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:600}.qc .pa{width:100%;justify-content:center;height:52px;margin-top:6px}.hand{position:absolute;top:30px;font-size:26px;animation:hd 1.6s ease-in-out infinite alternate}@keyframes hd{to{transform:translateX(40px)}}
@media(min-width:900px){.qc{left:7vw;right:auto;width:440px;bottom:auto;top:50%;transform:translateY(-50%)}}</style>
<section class="sc"><svg id="s1"></svg><div class="copy"><h1>Dime cómo escuchas.</h1><p>Y te diré qué botella eres. Cinco preguntas, 30 segundos.</p><div class="row"><button class="pill pa">Empezar el juego</button></div></div></section>
<section class="sc"><svg id="s2"></svg><div class="card qc"><div class="dots"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div><h3>Alguien te cuenta algo que le duele. Tú…</h3><div class="track"><b style="width:30%"></b><span class="knob" style="left:calc(30% - 20px)"><svg width="24" height="12" viewBox="0 0 120 40"><path d="M16 6h56q14 0 18 8h18v12H90q-4 8-18 8H16q-10 0-10-14T16 6z" fill="#04121C"/></svg></span><span class="hand" style="left:calc(30% + 6px)">👆</span></div><div class="ends"><span>Escucho hasta el final</span><span>Busco una solución</span></div><button class="pill pa" style="margin-top:18px">Elegir</button></div></section>
<section class="sc"><svg id="s3"></svg><div class="copy"><span class="chip">Tu resultado</span><h2>Eres Faro.</h2><p>Escuchas hasta el final. Tu primera botella ya está sellada y te espera.</p><div class="row"><button class="pill pa">Abrir mi botella</button></div></div></section>
<script>
const W=innerWidth,H=innerHeight,D=W>=900,m=Math.min(W,H);
const set=(id,s)=>{const e=document.getElementById(id);e.setAttribute('viewBox',`0 0 ${W} ${H}`);e.innerHTML=s;};
const sky=id=>defs(id)+`<rect width="${W}" height="${H}" fill="url(#${id}sky)"/>`;
// archipiélago isométrico: cada isla es un tipo de oyente
const arch=(cx,cy,s)=>{const t=[[0,0,ORB[0],1.2],[-2,1,ORB[1],.8],[2,1,ORB[2],.9],[-1,2.2,ORB[3],.7],[1.4,2.4,ORB[4],.75],[0,-1.6,ORB[5],.6]];let o='';t.sort((a,b)=>a[1]-b[1]).forEach(([dx,dy,c,k],i)=>{const x=cx+dx*s*1.1,y=cy+dy*s*.62;o+=`<g class="drift" style="animation-delay:-${i}s"><ellipse cx="${x}" cy="${y+s*k*.9}" rx="${s*k}" ry="${s*k*.3}" fill="#000" opacity=".25"/>${iso(x,y,s*k,s*k*.5,c)}</g>`;});return o;};
{const id='a',s=D?H*.12:m*.15,cx=D?W*.68:W*.5,cy=D?H*.46:H*.34;
set('s1',sky(id)+stars(W,H,D?200:90,14)+moon(id,W*.86,H*.12,m*.05)+arch(cx,cy,s)
+`<g transform="translate(${cx-30} ${cy-s*.6})"><g class="bob">${bottle(id,.55)}</g></g><g transform="translate(${cx-2.2*s} ${cy+s*.15}) scale(.8)">${sitter()}</g>`
+lighthouse(cx+2.2*s,cy+s*.5,.5)+`<g transform="translate(${cx-1.1*s} ${cy+1.3*s})">${'<circle r="3" fill="#FFD98A"/>'}</g>`);}
{const id='b',s=D?H*.1:m*.11,cx=D?W*.7:W*.5,cy=D?H*.45:H*.2;
set('s2',sky(id)+stars(W,H,D?160:80,15)+arch(cx,cy,s)+`<g transform="translate(${cx-1.9*s} ${cy+s*.1}) scale(.7)">${sitter()}</g><g transform="translate(${cx+1.9*s} ${cy+s*.15}) scale(-.7 .7)">${sitter()}</g>`);}
{const id='c',s=D?H*.2:m*.3,cx=D?W*.68:W*.5,cy=D?H*.55:H*.42;
set('s3',sky(id)+stars(W,H,D?200:90,16)+`<circle cx="${cx}" cy="${cy-s*.6}" r="${s*1.6}" fill="url(#${id}warm)"/>`+`<ellipse cx="${cx}" cy="${cy+s*.9}" rx="${s}" ry="${s*.3}" fill="#000" opacity=".3"/>`+iso(cx,cy,s,s*.45,ORB[1])+lighthouse(cx+s*.35,cy-s*.05,s/170)
+`<g transform="translate(${cx-s*.75} ${cy-s*.32}) rotate(-8)">${bottle(id,s/150)}<circle cx="${s/150*112}" cy="${s/150*20}" r="${s/150*9}" fill="#C8323E"/></g>`
+orbG(cx-s*1.1,cy-s*1.2,6,ORB[0])+orbG(cx+s*1.2,cy-s*1.1,5,ORB[3])+orbG(cx+s*.9,cy-s*1.7,4,ORB[2]));}
</script></body></html>
